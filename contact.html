<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Contact Us</h1>
        <p>Have questions or feedback? Reach out to us!</p>
    </header>
    <nav>
        <ul>
            <li><a href="index.html">About Washington</a></li>
            <li><a href="olympia.html">Olympia</a></li>
            <li><a href="spokane.html">Spokane</a></li>
            <li><a href="seattle.html">Seattle</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>
    </nav>

    <main class="container">
        <section class="main-content">
            <h2>Get in Touch</h2>
            <p>We'd love to hear from you! Please fill out the form below </p>

            <!-- Contact Form -->
            <form id="contact-form">
                <div class="form-group">
                    <label for="firstname">First Name:</label>
                    <input type="text" id="firstname" name="firstname" required>
                </div>
                <div class="form-group">
                    <label for="lastname">Last Name:</label>
                    <input type="text" id="lastname" name="lastname" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="confirmEmail">Confirm Email:</label>
                    <input type="email" id="confirmEmail" name="confirmEmail" required>
                </div>
                <div class="form-group">
                    <label for="question">Your Question or Comment:</label>
                    <textarea id="question" name="question" rows="4" required></textarea>
                </div>
                <button type="submit">Submit</button>
                <button type="reset">Reset</button>
            </form>

        </section>

        <aside class="sidebar">
           
            <div class="sidebar-text">          
                <h3>Our Office</h3>
                    <p>123 Imaginary lane, Washington, USA<br>
                    Phone: (123) 456-7890<br></p>
            </div>
        </aside>
            
    </main>

    <!-- Footer -->
     <footer>
        <p>&copy; 2026 Skylar O'Keefe</p>
     </footer>
    
</body>
</html>
